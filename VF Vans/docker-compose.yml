services:
  packing-list:
    build: .
    image: packing-list-app:latest
    container_name: packing-list
    ports:
      - "8000:8501"           # ← host 8000 → container 8501
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
